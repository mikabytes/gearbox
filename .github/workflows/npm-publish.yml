# npm is published manually before the version tag is pushed. This workflow
# verifies the tagged source while docker-image.yml builds and publishes it.

name: Node.js tests

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm install
      - run: npm test
