# npm is published manually before the version tag is pushed. This workflow
# verifies the tagged source while docker-image.yml builds and publishes it.

name: Node.js tests

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 20
      - run: npm install
      - run: npm test
